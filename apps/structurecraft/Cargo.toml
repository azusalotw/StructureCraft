[package]
name = "structurecraft"
description = "StructureCraft desktop app (Windows, macOS, Linux)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
structurecraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
# Vulkan, Metal, DX12 and GL backends (eframe enables none without its default features).
wgpu = { workspace = true, features = ["dx12", "gles", "metal", "vulkan"] }
log = { workspace = true }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
